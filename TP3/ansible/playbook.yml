# Playbook principal : déploie l'application sur le serveur
# Lancement : ansible-playbook -i inventories/setup.yml playbook.yml
- hosts: all
  gather_facts: true
  become: true

  roles:
    - docker      # installe Docker
    - network     # crée les réseaux
    - database    # lance PostgreSQL
    - app         # lance l'API
    - front       # frontend
    - proxy       # lance Apache

  vars_files:
    - group_vars/vault.yml