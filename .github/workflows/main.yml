name: CI devops 2025
on:
  #to begin you want to launch this job in main and develop
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify --file TP1/simpleapi/pom.xml

  # define job to build and publish docker image
  build-and-push-docker-image:
    needs: test-backend
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./TP1/simpleapi
          # Note: tags has to be all lower-case
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp1-backend:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./TP1/database
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp1-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-front:${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}

  # Continuous Deployment : lance les rôles Ansible sur le serveur

  deploy:
    needs: build-and-push-docker-image
    # uniquement sur main (les images ne sont poussées que là)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    # un seul déploiement à la fois
    concurrency: production-deploy


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: pip install ansible

      - name: Prepare SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H victor.li-yim.takima.school >> ~/.ssh/known_hosts

      - name: Deploy with Ansible
        working-directory: TP3/ansible
        env:
          ANSIBLE_FORCE_COLOR: "1"
        run: |
          echo "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault_pass"
          ansible-playbook \
            -i inventories/setup.yml \
            playbook.yml \
            --vault-password-file "$RUNNER_TEMP/vault_pass" \
            -e ansible_ssh_private_key_file=$HOME/.ssh/id_rsa \
            -e dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }} \
            -e image_tag=${{ github.sha }}
          rm -f "$RUNNER_TEMP/vault_pass"

      - name: Check API health
        run: |
          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            http://victor.li-yim.takima.school/actuator/health