name: Build and push docker images
on:
  workflow_run:
    workflows: ["Test backend"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push-docker-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./TP1/simpleapi
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-backend:${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./TP1/database
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-database:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-database:${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./TP1/HTML
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-httpd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-httpd:${{ github.event.workflow_run.head_sha }}
          push: true

      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-front:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tp1-front:${{ github.event.workflow_run.head_sha }}
          push: true