name: Test backend
on:
  # lancé sur main et develop (la branche principale du dépôt s'appelle main)
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test with Maven
        run: mvn clean verify --file TP1/simpleapi/pom.xml

      # Analyse SonarCloud : le pipeline échoue si le Quality Gate n'est pas atteint
      - name: SonarCloud analysis
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=VictorLiYim_TP_Docker
          -Dsonar.organization=victorliyim
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}
          -Dsonar.qualitygate.wait=true
          --file TP1/simpleapi/pom.xml