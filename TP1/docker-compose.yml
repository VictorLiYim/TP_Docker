# Application 3-tiers : httpd (reverse proxy) -> backend (API) -> database (PostgreSQL)
services:
  backend:
    build: simpleapi
    image : victorliy/tp1-backend:1.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - backend-net
      - frontend-net
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  database:
    build: database
    image : victorliy/tp1-database:1.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  httpd:
    build:
      context: ../front
      dockerfile: Dockerfile
    image: victorliy/tp1-frontend:1.0
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - frontend-net
    depends_on:
      backend:
        condition: service_healthy

networks:
  backend-net:   # backend <-> database (isolé d'Apache)
  frontend-net:     # frontend <-> backend

volumes:
  db-data: